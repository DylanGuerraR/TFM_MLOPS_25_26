services:
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    networks: [ tfm_net ]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  airflow-init:
    image: tfm-airflow:2.8.4-docker
    build:
      context: ./airflow-image
      dockerfile: Dockerfile
    container_name: airflow-init
    networks: [ tfm_net ]
    depends_on:
      airflow-postgres:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/opt/airflow/repo
    group_add:
      - "999"
    command: [ "bash", "-lc", "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true" ]
    restart: "no"

  airflow-webserver:
    image: tfm-airflow:2.8.4-docker
    container_name: airflow-webserver
    networks: [ tfm_net ]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/opt/airflow/repo
    group_add:
      - "999"
    command: [ "airflow", "webserver" ]
    restart: unless-stopped

  airflow-scheduler:
    image: tfm-airflow:2.8.4-docker
    container_name: airflow-scheduler
    networks: [ tfm_net ]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/opt/airflow/repo
    group_add:
      - "999"
    command: [ "airflow", "scheduler" ]
    restart: unless-stopped

networks:
  tfm_net:
    name: tfm_net

volumes:
  airflow_pgdata:
    name: airflow_pgdata
