# Fichero: compose.kafka.yml
# Propósito: Despliegue de un cluster de Kafka en modo KRaft (sin Zookeeper)
# Componentes: 3 Controladores (Quorum) + 3 Brokers (Data) + Interfaz UI.

services:
  # --- CONTROLADORES (Gestión del Cluster) ---
  controller-1:
    image: confluentinc/cp-kafka:${TAG}
    hostname: controller-1
    container_name: controller-1
    networks: [ tfm_net ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9095,2@controller-2:9096,3@controller-3:9097"
      KAFKA_LISTENERS: "CONTROLLER://controller-1:9095"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      CLUSTER_ID: ${CLUSTER_ID}
    restart: unless-stopped

  controller-2:
    image: confluentinc/cp-kafka:${TAG}
    hostname: controller-2
    container_name: controller-2
    networks: [ tfm_net ]
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9095,2@controller-2:9096,3@controller-3:9097"
      KAFKA_LISTENERS: "CONTROLLER://controller-2:9096"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      CLUSTER_ID: ${CLUSTER_ID}
    restart: unless-stopped

  controller-3:
    image: confluentinc/cp-kafka:${TAG}
    hostname: controller-3
    container_name: controller-3
    networks: [ tfm_net ]
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9095,2@controller-2:9096,3@controller-3:9097"
      KAFKA_LISTENERS: "CONTROLLER://controller-3:9097"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      CLUSTER_ID: ${CLUSTER_ID}
    restart: unless-stopped

  # --- BROKERS (Almacenamiento y paso de mensajes) ---
  broker-1:
    image: confluentinc/cp-kafka:${TAG}
    hostname: broker-1
    container_name: broker-1
    networks: [ tfm_net ]
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-1:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENERS: "PLAINTEXT://broker-1:29092,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9095,2@controller-2:9096,3@controller-3:9097"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      retries: 20
    restart: unless-stopped

  broker-2:
    image: confluentinc/cp-kafka:${TAG}
    hostname: broker-2
    container_name: broker-2
    networks: [ tfm_net ]
    depends_on: [ controller-1, controller-2, controller-3 ]
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-2:29093,PLAINTEXT_HOST://localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://broker-2:29093,PLAINTEXT_HOST://0.0.0.0:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9095,2@controller-2:9096,3@controller-3:9097"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      retries: 20
    restart: unless-stopped

  broker-3:
    image: confluentinc/cp-kafka:${TAG}
    hostname: broker-3
    container_name: broker-3
    networks: [ tfm_net ]
    depends_on: [ controller-1, controller-2, controller-3 ]
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-3:29094,PLAINTEXT_HOST://localhost:9094"
      KAFKA_LISTENERS: "PLAINTEXT://broker-3:29094,PLAINTEXT_HOST://0.0.0.0:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9095,2@controller-2:9096,3@controller-3:9097"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9094 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      retries: 20
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [ tfm_net ]
    depends_on:
      broker-1: { condition: service_healthy }
      broker-2: { condition: service_healthy }
      broker-3: { condition: service_healthy }
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tfm-leads-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker-1:29092,broker-2:29093,broker-3:29094"
    restart: unless-stopped

networks:
  tfm_net:
    name: tfm_net

volumes:
  datalake:
    name: tfm_datalake
